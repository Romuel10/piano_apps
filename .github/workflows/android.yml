name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: piano-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test MusicXML and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: piano-solfege-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Only a push to main may access the distribution signing key.
      # Configure the four repository secrets described in SIGNING.md.
      - name: Prepare private signing certificate
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.PIANO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIANO_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PIANO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIANO_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No release signing key configured: debug APK only."
          else
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pianopartition-release.jks"
            echo "PIANO_KEYSTORE_FILE=$RUNNER_TEMP/pianopartition-release.jks" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed, updatable release APK and Play bundle
        if: steps.signing.outputs.enabled == 'true'
        env:
          PIANO_KEYSTORE_PASSWORD: ${{ secrets.PIANO_KEYSTORE_PASSWORD }}
          PIANO_KEY_PASSWORD: ${{ secrets.PIANO_KEY_PASSWORD }}
          PIANO_KEY_ALIAS: ${{ secrets.PIANO_KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: piano-partition-plus-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store bundle
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: piano-partition-plus-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/pianopartition-release.jks"

      - name: Build unsigned release for local signing
        if: steps.signing.outputs.enabled != 'true' && github.event_name == 'push'
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload unsigned release APK
        if: steps.signing.outputs.enabled != 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: piano-partition-plus-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  omr-server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify private Audiveris HTTP bridge
        run: python3 -m unittest discover -s omr-server/tests -v

  omr-container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Audiveris 5.11 container
        run: docker build --pull -t piano-omr-ci ./omr-server
      - name: Verify Audiveris command-line engine works in container
        run: timeout 75s docker run --rm --entrypoint /usr/local/bin/audiveris-headless piano-omr-ci -help

      - name: Start private recognition API
        run: |
          docker run -d --rm --name piano-omr-ci -p 127.0.0.1:18080:8080 \
            -e OMR_API_TOKEN=ci-test-secret-token-with-32-chars piano-omr-ci
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs piano-omr-ci
          exit 1
      - name: End-to-end recognition of the exact Canon in D printed score
        run: |
          # Download the exact publicly available two-page edition sent by the
          # user, without adding the copyrighted PDF to the repository.
          curl --fail --location --retry 2 --max-time 45 \
            -o "$RUNNER_TEMP/canon.pdf" \
            "https://www.musictheoryacademy.com/wp-content/uploads/2021/01/Pachelbel-Canon-in-D-piano-sheet-music.pdf"
          test -s "$RUNNER_TEMP/canon.pdf"
          curl --fail --show-error --silent --max-time 230 \
            -H "Authorization: Bearer ci-test-secret-token-with-32-chars" \
            -H "Content-Type: application/pdf" \
            --data-binary @"$RUNNER_TEMP/canon.pdf" \
            -o "$RUNNER_TEMP/recognized.mxl" \
            http://127.0.0.1:18080/v1/recognize
          python3 - <<'PY'
          import os, io, zipfile
          from pathlib import Path
          response = Path(os.environ["RUNNER_TEMP"]) / "recognized.mxl"
          raw = response.read_bytes()
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              xml = b"".join(
                  archive.read(name) for name in archive.namelist()
                  if name.lower().endswith((".xml", ".musicxml"))
                  and not name.lower().startswith("meta-inf/")
              )
          assert b"score-partwise" in xml or b"score-timewise" in xml, "Missing MusicXML score"
          note_count = xml.count(b"<note>")
          measure_count = xml.count(b"<measure ")
          print("Canon in D OMR: recognized", note_count, "note elements in", measure_count, "measures.")
          assert note_count >= 30, "Too few notes recognized from the two-page sample"
          PY

      - name: Stop test container
        if: always()
        run: docker rm -f piano-omr-ci || true
